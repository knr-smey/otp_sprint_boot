spring.application.name=spring_boot_project_api

# API port - 8080 is occupied by another project (etec_backend) on this machine.
server.port=${SERVER_PORT:8089}

# MySQL connection - local dev defaults point at THIS project's dockerized MySQL
# (started via `docker compose up -d`): root / no password, host port 3309, database
# "2fadb". phpMyAdmin for it runs on http://localhost:8083 (see .env: PMA_PORT).
# Override any value with an environment variable, e.g. DB_HOST, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:2fadb}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway migrations; Hibernate only validates. The {vendor} placeholder
# selects db/migration/mysql or db/migration/h2 depending on the datasource.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:your@gmail.com}

# password : asdjqwqeasdqefa
spring.mail.password=${GMAIL_APP_PASSWORD:your_app_password} 

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Custom Application Name
app.mail.from-name=${APP_MAIL_FROM_NAME:OTP Service}