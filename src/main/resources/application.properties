spring.application.name=spring_boot_project_api

# MySQL connection - works out of the box with either XAMPP (default root user, no
# password, port 3306) or `docker compose up -d` (see docker-compose.yml). Override any
# value with an environment variable, e.g. DB_HOST, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spring_boot_project_api}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway migrations; Hibernate only validates. The {vendor} placeholder
# selects db/migration/mysql or db/migration/h2 depending on the datasource.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT -------------------------------------------------------------------
# Signing secret for access/refresh/2FA-pending tokens. MUST be overridden with a
# strong random value (min 32 chars) via the JWT_SECRET environment variable in production.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-32b}
app.jwt.issuer=spring_boot_project_api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
# Short-lived token issued after password check when 2FA is enabled; grants nothing but /auth/2fa/verify.
app.jwt.two-factor-pending-ttl=5m

# --- TOTP secret encryption -------------------------------------------------
# AES-256 key (Base64, decodes to exactly 32 bytes) used to encrypt TOTP secrets at rest.
# Generate with: openssl rand -base64 32   -- override via TOTP_ENCRYPTION_KEY in production.
app.crypto.totp-key=${TOTP_ENCRYPTION_KEY:QNiK7ASt82FAhg3ekAmQt+HCz/lXoNjZKYtZB+pdltA=}

# --- Two-factor authentication ----------------------------------------------
# Label shown in Google Authenticator next to the one-time code.
app.two-factor.issuer=spring-boot-project-api
# Brute-force protection for OTP verification.
app.two-factor.max-failures=5
app.two-factor.failure-window=15m
app.two-factor.lock-duration=15m
# Number of one-time backup codes generated on enable / regenerate.
app.two-factor.backup-code-count=10
