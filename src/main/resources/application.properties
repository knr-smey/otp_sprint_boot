spring.application.name=spring_boot_project_api

# API port - 8080 is occupied by another project (etec_backend) on this machine.
server.port=${SERVER_PORT:8081}

# MySQL connection - local dev defaults point at THIS project's dockerized MySQL
# (started via `docker compose up -d`): root / no password, host port 3309, database
# "2fadb". phpMyAdmin for it runs on http://localhost:8083 (see .env: PMA_PORT).
# NOTE: 8082 on this machine is a different project's phpMyAdmin web UI - not MySQL.
# Override any value with an environment variable, e.g. DB_HOST, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:2fadb}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway migrations; Hibernate only validates. The {vendor} placeholder
# selects db/migration/mysql or db/migration/h2 depending on the datasource.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT -------------------------------------------------------------------
# Signing secret for access/refresh/2FA-pending tokens. MUST be overridden with a
# strong random value (min 32 chars) via the JWT_SECRET environment variable in production.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-32b}
app.jwt.issuer=spring_boot_project_api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
# Short-lived token issued after a successful password check; grants nothing but /auth/otp/*.
app.jwt.otp-pending-ttl=5m

# --- Email OTP login (the only second login step) -----------------------------
# Every successful password login mails a single-use 6-digit code to the user's address.
# Gmail requires an App Password (Google Account > Security > 2-Step Verification >
# App passwords). MAIL creds MUST be set or logins fail with a mail error.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.otp.issuer=spring-boot-project-api
# Brute-force protection for OTP verification.
app.otp.max-failures=5
app.otp.failure-window=15m
app.otp.lock-duration=15m
app.otp.email-enabled=${EMAIL_OTP_ENABLED:true}
app.otp.code-ttl=5m
app.otp.resend-cooldown=60s
