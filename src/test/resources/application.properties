spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Same posture as production: Flyway owns the schema, Hibernate only validates.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.jwt.secret=test-jwt-signing-secret-at-least-32-chars-long
app.jwt.issuer=spring_boot_project_api
app.crypto.totp-key=QNiK7ASt82FAhg3ekAmQt+HCz/lXoNjZKYtZB+pdltA=
